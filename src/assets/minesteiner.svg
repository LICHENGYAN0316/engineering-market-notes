<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="mine-title mine-desc">
  <title id="mine-title">MineSteiner network topology sketch</title>
  <desc id="mine-desc">A portal and four fixed terminals connect through three movable branch points. The layout illustrates shared segments and does not show the coordinates of a test case.</desc>
  <rect x="1" y="1" width="758" height="358" rx="24" fill="#f2f6f3" stroke="#c8d8d0" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <text x="35" y="40" fill="#335c51" font-size="15" font-weight="700" letter-spacing="2">TOPOLOGY SKETCH</text>
    <text x="35" y="73" fill="#142e29" font-size="24" font-weight="700">A shared connection network</text>
    <g fill="none" stroke="#d2ded7" stroke-width="1.5" aria-hidden="true">
      <path d="M70 238 392 122 695 190 373 306ZM131 215l303 68m-242-90 303 68m-242-90 303 68m-242-90 303 68m-242-90 303 68M127 251l321-116m-261 130 321-116m-261 130 321-116m-261 130 321-116"/>
    </g>
    <g fill="none" stroke="#26685c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M115 208 296 181 432 132 590 105M432 132 640 155M296 181 455 217 646 233M455 217 525 276"/>
    </g>
    <g fill="#ffffff" stroke="#142e29" stroke-width="3">
      <circle cx="590" cy="105" r="8"/><circle cx="640" cy="155" r="8"/>
      <circle cx="646" cy="233" r="8"/><circle cx="525" cy="276" r="8"/>
    </g>
    <rect x="106" y="199" width="18" height="18" rx="4" fill="#26685c" stroke="#142e29" stroke-width="2"/>
    <text x="79" y="190" fill="#142e29" font-size="18" font-weight="700">Portal</text>
    <g fill="#bd5a32" stroke="#ffffff" stroke-width="2">
      <circle cx="296" cy="181" r="8"/><circle cx="432" cy="132" r="8"/><circle cx="455" cy="217" r="8"/>
    </g>
    <line x1="35" y1="310" x2="725" y2="310" stroke="#c8d8d0" stroke-width="1.5"/>
    <circle cx="43" cy="333" r="6" fill="#ffffff" stroke="#142e29" stroke-width="2"/>
    <text x="58" y="338" fill="#142e29" font-size="16">Fixed terminal</text>
    <circle cx="213" cy="333" r="6" fill="#bd5a32"/>
    <text x="228" y="338" fill="#142e29" font-size="16">Movable branch point</text>
    <path d="M430 333h22" stroke="#26685c" stroke-width="4" stroke-linecap="round"/>
    <text x="464" y="338" fill="#142e29" font-size="16">Network segment</text>
  </g>
</svg>
