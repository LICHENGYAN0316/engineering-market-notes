<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="vic-title vic-desc">
  <title id="vic-title">VIC1 hourly forecast and chronological split</title>
  <desc id="vic-desc">Each model window takes 168 hours of historical features and outputs 24 future hourly prices. The data split runs from training to validation to final test with 168-hour gaps separating the partitions. The drawing is not to scale.</desc>
  <defs>
    <pattern id="vic-gap" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M1 0v5" stroke="#9b512f" stroke-width="1.5"/></pattern>
    <marker id="vic-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#275f55"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="358" rx="24" fill="#f2f6f3" stroke="#c8d8d0" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <text x="35" y="40" fill="#335c51" font-size="15" font-weight="700" letter-spacing="2">FORECAST DESIGN</text>
    <text x="35" y="73" fill="#142e29" font-size="24" font-weight="700">A week of history to predict the next day</text>
    <rect x="38" y="106" width="338" height="83" rx="12" fill="#dcece5" stroke="#628c7e" stroke-width="1.5"/>
    <text x="56" y="139" fill="#142e29" font-size="24" font-weight="700">168 hours</text>
    <text x="56" y="165" fill="#254b43" font-size="17">Historical features</text>
    <g fill="#95b5aa" aria-hidden="true">
      <rect x="214" y="145" width="15" height="15" rx="3"/><rect x="236" y="145" width="15" height="15" rx="3"/>
      <rect x="258" y="145" width="15" height="15" rx="3"/><rect x="280" y="145" width="15" height="15" rx="3"/>
      <rect x="302" y="145" width="15" height="15" rx="3"/><rect x="324" y="145" width="15" height="15" rx="3"/>
      <rect x="346" y="145" width="15" height="15" rx="3"/>
    </g>
    <g fill="none" stroke="#275f55" stroke-width="2.5" marker-end="url(#vic-arrow)">
      <path d="M381 148h29"/><path d="M552 148h30"/>
    </g>
    <rect x="417" y="122" width="128" height="52" rx="12" fill="#204d45"/>
    <text x="481" y="153" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="650">Forecast model</text>
    <rect x="590" y="106" width="132" height="83" rx="12" fill="#f8e7dc" stroke="#a55132" stroke-width="1.5"/>
    <text x="606" y="139" fill="#7a311a" font-size="23" font-weight="700">24 hours</text>
    <text x="606" y="165" fill="#7a311a" font-size="16">Hourly prices</text>
    <line x1="35" y1="217" x2="725" y2="217" stroke="#c8d8d0" stroke-width="1.5"/>
    <text x="38" y="248" fill="#142e29" font-size="18" font-weight="700">Chronological evaluation</text>
    <rect x="38" y="264" width="371" height="39" rx="6" fill="#204d45"/>
    <rect x="416" y="264" width="18" height="39" fill="url(#vic-gap)"/>
    <rect x="441" y="264" width="126" height="39" rx="6" fill="#dcece5" stroke="#628c7e" stroke-width="1.5"/>
    <rect x="574" y="264" width="18" height="39" fill="url(#vic-gap)"/>
    <rect x="599" y="264" width="123" height="39" rx="6" fill="#dcece5" stroke="#628c7e" stroke-width="1.5"/>
    <text x="58" y="289" fill="#ffffff" font-size="16" font-weight="650">Training</text>
    <text x="504" y="289" text-anchor="middle" fill="#142e29" font-size="16" font-weight="650">Validation</text>
    <text x="660" y="289" text-anchor="middle" fill="#142e29" font-size="16" font-weight="650">Final test</text>
    <rect x="38" y="322" width="15" height="15" fill="url(#vic-gap)"/>
    <text x="63" y="335" fill="#254b43" font-size="16">168-hour separation gap</text>
  </g>
</svg>
